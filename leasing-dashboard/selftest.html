<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">

<title>自己診断</title>
<link rel="stylesheet" href="styles.css">

    <h1>週次リーシングダッシュボード 自己診断</h1>

  </div>
</header>

      <table>
        <thead><tr><th>区分</th><th>確認内容</th><th>結果</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="config.js"></script>
